name: Deploy SevenRise Admin Bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/sevenrise-admin-bot/**"
      - ".github/workflows/deploy-sevenrise-admin-bot.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN GitHub secret" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF GitHub secret" && exit 1)
          supabase functions deploy sevenrise-admin-bot --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Configure function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          test -n "$TELEGRAM_ADMIN_BOT_TOKEN" || (echo "Missing TELEGRAM_ADMIN_BOT_TOKEN GitHub secret" && exit 1)
          test -n "$TELEGRAM_WEBHOOK_SECRET" || (echo "Missing TELEGRAM_WEBHOOK_SECRET GitHub secret" && exit 1)
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" TELEGRAM_ADMIN_BOT_TOKEN="$TELEGRAM_ADMIN_BOT_TOKEN" TELEGRAM_ADMIN_ID="1512444619" TELEGRAM_WEBHOOK_SECRET="$TELEGRAM_WEBHOOK_SECRET"

      - name: Set Telegram webhook
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          TELEGRAM_ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          WEBHOOK_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/sevenrise-admin-bot"
          curl --fail --silent --show-error --get "https://api.telegram.org/bot${TELEGRAM_ADMIN_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${WEBHOOK_URL}" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}" \
            --data-urlencode "drop_pending_updates=true"
